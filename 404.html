<script>
/* The theme the visitor chose, read straight from the store the rest of the
   site writes. This page loads no script of its own -- the failure it reports
   might be the very thing that stops one arriving. */
try {
  var t = localStorage.getItem('jooob.theme');
  document.documentElement.dataset.theme = t
    || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
} catch (e) { /* a blocked store just means the default stands */ }
</script>
